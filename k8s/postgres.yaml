apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: claper-db
spec:
  serviceName: claper-db
  replicas: 1
  selector:
    matchLabels: {app: claper-db}
  template:
    metadata:
      labels: {app: claper-db}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:16
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: claper}
            - {name: POSTGRES_DB, value: claper}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: claper-secrets, key: DB_PASSWORD}}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: csi-ceph-rbd-du
        resources:
          requests: {storage: 5Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: claper-db
spec:
  selector: {app: claper-db}
  ports: [{port: 5432}]
