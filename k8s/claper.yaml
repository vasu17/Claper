apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claper-uploads
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: csi-ceph-rbd-du
  resources:
    requests: {storage: 5Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claper
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: claper}
  template:
    metadata:
      labels: {app: claper}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: claper
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          image: ghcr.io/vasu17/claper:latest
          imagePullPolicy: Always
          ports: [{containerPort: 4000}]
          env:
            - {name: BASE_URL, value: "https://friday.seminar.dyn.cloud.e-infra.cz"}
            - {name: PORT, value: "4000"}
            - {name: HOME, value: /tmp}
            - {name: POOL_SIZE, value: "5"}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: claper-secrets, key: DB_PASSWORD}}
            - name: DATABASE_URL
              value: "postgres://claper:$(DB_PASSWORD)@claper-db:5432/claper"
            - name: SECRET_KEY_BASE
              valueFrom: {secretKeyRef: {name: claper-secrets, key: SECRET_KEY_BASE}}
          resources:
            requests: {cpu: 50m, memory: 300Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            tcpSocket: {port: 4000}
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - {name: uploads, mountPath: /app/uploads}
      volumes:
        - name: uploads
          persistentVolumeClaim: {claimName: claper-uploads}
---
apiVersion: v1
kind: Service
metadata:
  name: claper
spec:
  selector: {app: claper}
  ports: [{port: 80, targetPort: 4000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: claper
  annotations:
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [friday.seminar.dyn.cloud.e-infra.cz]
      secretName: friday-seminar-dyn-cloud-e-infra-cz-tls
  rules:
    - host: friday.seminar.dyn.cloud.e-infra.cz
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: claper, port: {number: 80}}}}
